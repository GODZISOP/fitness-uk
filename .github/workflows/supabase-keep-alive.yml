name: Supabase Always-Alive Heartbeat

on:
  schedule:
    # Runs at 06:00 UTC every 2 days (Supabase free tier pauses after 7 days of inactivity)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          echo "Triggering automated keep-alive heartbeat..."
          
          # 1. Ping via Supabase API directly (using publishable anon key as fallback)
          API_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="sb_publishable_-WBbXW90QrO2Am4lesj76w_k8_x50f1"
          fi
          
          SUPA_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          if [ -z "$SUPA_URL" ]; then
            SUPA_URL="https://khkiyplybehsspxtmvkf.supabase.co"
          fi

          echo "Pinging Supabase REST API at $SUPA_URL/rest/v1/clients ..."
          curl -s -f \
            -H "apikey: $API_KEY" \
            -H "Authorization: Bearer $API_KEY" \
            "$SUPA_URL/rest/v1/clients?select=id&limit=1" || echo "API direct ping executed"

          # 2. Ping deployed app keep-alive route if configured
          SITE_URL="${{ secrets.DEPLOYED_SITE_URL }}"
          if [ -n "$SITE_URL" ]; then
            echo "Pinging deployed site at $SITE_URL/api/ping ..."
            curl -s -f "$SITE_URL/api/ping" || echo "Site ping attempted"
          fi
          
          echo "Heartbeat process completed."
