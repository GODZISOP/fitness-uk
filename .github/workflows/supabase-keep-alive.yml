name: Supabase Always-Alive Heartbeat

on:
  schedule:
    # Runs at 06:00 UTC every 2 days (Supabase free tier pauses after 7 days of inactivity)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          echo "Triggering automated keep-alive heartbeat..."
          
          # 1. Ping via Supabase API if secret is configured
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            curl -s -f \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://khkiyplybehsspxtmvkf.supabase.co' }}/rest/v1/clients?select=id&limit=1" || echo "API ping attempted"
          fi

          # 2. Ping deployed app keep-alive route
          SITE_URL="${{ secrets.DEPLOYED_SITE_URL }}"
          if [ -n "$SITE_URL" ]; then
            curl -s -f "$SITE_URL/api/ping" || echo "Site ping attempted"
          fi
          
          echo "Heartbeat process completed."
